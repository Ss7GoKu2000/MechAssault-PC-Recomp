# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# MechAssault Rev 1 gameplay camera projection and frustum.
[[hook]]
at = 0x3A519
call = "MechAssaultNativeProjection"

[[hook]]
at = 0x395AF
call = "MechAssaultNativeCullSides"

[[hook]]
at = 0x396E6
call = "MechAssaultNativeCullVertical"

[[hook]]
at = 0x3A5C0
call = "MechAssaultNativeCullDone"

# Reuse the original dashboard row as a native PC Exit command.
[[hook]]
at = 0x87A1E
call = "MechAssaultKeepExitVisible"
on_true = 0x87A21

[[hook]]
at = 0x87A29
call = "MechAssaultSetExitLabel"

[[hook]]
at = 0x87A40
call = "MechAssaultExitFromMainMenu"
on_true = "ret"

# Front-end Options repurposes the row for the Xbox Demos disc.
[[hook]]
at = 0xA9413
call = "MechAssaultSetOptionsGraphics"

[[hook]]
at = 0xA9440
call = "MechAssaultOptionsGraphicsSelected"
on_true = "ret"

# Observe the separate pause layouts before adding their Graphics row.
[[hook]]
at = 0xA7651
call = "MechAssaultTracePauseRows"

[[hook]]
at = 0xA7670
call = "MechAssaultPauseMenuFrame"

[[hook]]
at = 0xA74D7
call = "MechAssaultAddPauseGraphics"

[[hook]]
at = 0x851E9
call = "MechAssaultPauseGraphicsSelected"
on_true = 0x851FA
